<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Fluency Trainer</title>
  <style>
    :root { --bg: #fff7e8; --ink: #1d1b38; --surface: #ffffff; --accent: #8a6cf0; --bad: #c0301b; --muted: #5b5878; }
    @media (prefers-color-scheme: dark) { :root { --bg: #242444; --ink: #f3f1ff; --surface: #2e2e55; --accent: #b6a1ff; --bad: #ff8d79; --muted: #b3b0d6; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
           font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 380px; background: var(--surface); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 5px 5px 0 var(--ink); padding: 26px 22px; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    input { width: 100%; font: inherit; padding: 12px 14px; border: 3px solid var(--ink); border-radius: 12px; background: var(--bg); color: var(--ink); }
    button { width: 100%; margin-top: 12px; font: inherit; font-weight: 700; padding: 12px; border: 3px solid var(--ink); border-radius: 12px; background: var(--accent); color: #1d1b38; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
    button:disabled { opacity: .55; }
    #err { min-height: 22px; margin-top: 10px; color: var(--bad); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Fluency Trainer</h1>
    <p>This app is protected. Enter the password to continue.</p>
    <form id="f">
      <label for="pw" style="display:none">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus required>
      <button id="go" type="submit">Open</button>
      <div id="err" role="alert"></div>
    </form>
  </main>
  <script>
    const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = ""; go.disabled = true;
      try {
        const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("pw").value }) });
        if (r.ok) { location.href = "/"; return; }
        const j = await r.json().catch(() => ({}));
        err.textContent = j.detail || "Could not log in.";
      } catch (_) { err.textContent = "Could not reach the app."; }
      go.disabled = false;
    });
  </script>
</body>
</html>
