<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluency Trainer</title>
  <script>try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preload" href="/static/fonts/outfit-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="deco d-sq"></div><div class="deco d-ring"></div><div class="deco d-dots"></div>
  <svg class="deco d-tri" viewBox="0 0 90 84"><polygon points="49,12 86,78 12,78" fill="#1d1b38"/><polygon points="45,8 82,74 8,74" fill="#f472b6" stroke="#1d1b38" stroke-width="3" stroke-linejoin="round"/></svg><div class="deco d-stripe"></div><div class="deco d-half"></div><div class="deco d-blob"></div><div class="deco d-pea"></div>
  <div class="deco bubble b-hey">Hey!</div><div class="deco bubble b-say">Say it out loud</div><div class="deco bubble b-go">You got this</div>
  <svg class="deco d-zig" viewBox="0 0 110 30" fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22 L21 8 L38 22 L55 8 L72 22 L89 8 L106 22"/></svg>
  <svg class="deco d-wave" viewBox="0 0 120 40" fill="none" stroke="#f472b6" stroke-width="7" stroke-linecap="round"><path d="M4 20 C 20 -2, 32 -2, 44 20 S 68 42, 80 20 S 104 -2, 116 20"/></svg>
  <header class="top">
    <div class="brand">Fluency <span>Trainer</span></div>
    <div class="top-right">
      <span id="day-badge" class="badge"></span>
      <span id="provider-badge" class="badge"></span>
      <button id="theme" type="button" aria-label="Switch between light and dark" title="Light or dark">&#9790;</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="notebook">Notebook</button>
    <button data-tab="history">History</button>
    <button data-tab="progress">Progress</button>
    <button data-tab="data">Data</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <main id="view"></main>
  <div id="overlay" class="overlay" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
